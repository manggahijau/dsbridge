name: Build dsbridge

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: armeabi-v7a
            api: 24
            artifact_name: dsbridged
            build_target: dsbridged
          - abi: arm64-v8a
            api: 24
            artifact_name: libdsbridge.so
            build_target: dsbridge
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Configure (${{ matrix.abi }})
        run: |
          cmake -B build-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ matrix.api }} \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (${{ matrix.build_target }})
        run: cmake --build build-${{ matrix.abi }} --target ${{ matrix.build_target }} --verbose

      - name: Locate output
        id: locate
        run: |
          set -e
          if [ "${{ matrix.build_target }}" = "dsbridged" ]; then
            OUT=$(find build-${{ matrix.abi }} -maxdepth 2 -name "dsbridged" -type f)
          else
            OUT=$(find build-${{ matrix.abi }} -maxdepth 2 -name "libdsbridge.so" -type f)
          fi
          echo "Found: $OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ matrix.abi }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

  extract_libstdcpp:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Locate bundled libstdc++.so (armeabi-v7a)
        id: locate
        run: |
          set -e
          NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          OUT=$(find "$NDK" -path "*arm-linux-androideabi*" -name "libstdc++.so" | head -n1)
          if [ -z "$OUT" ]; then
            echo "libstdc++.so not found in this NDK; trying broader search"
            OUT=$(find "$NDK" -iname "libstdc++*.so" | grep -i arm | grep -vi aarch64 | head -n1)
          fi
          echo "Found: $OUT"
          file "$OUT" || true
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libstdc++.so-armeabi-v7a
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

  extract_real_gnu_libstdcpp:
    runs-on: ubuntu-latest
    steps:
      - name: Set up OLD Android NDK (r16b, last release with real gnu-libstdc++)
        uses: nttld/setup-ndk@v1
        id: setup-ndk-old
        with:
          ndk-version: r16b

      - name: Locate real gnu-libstdc++ shared library (armeabi-v7a)
        id: locate
        run: |
          set -e
          NDK=${{ steps.setup-ndk-old.outputs.ndk-path }}
          echo "NDK path: $NDK"
          find "$NDK/sources/cxx-stl" -maxdepth 3 -type d || true
          OUT=$(find "$NDK/sources/cxx-stl/gnu-libstdc++" -path "*armeabi-v7a*" -name "libgnustl_shared.so" | head -n1)
          if [ -z "$OUT" ]; then
            echo "libgnustl_shared.so not found, listing what IS there:"
            find "$NDK/sources/cxx-stl" -iname "*.so" | grep -i "armeabi-v7a\|/arm/"
            exit 1
          fi
          echo "Found: $OUT"
          file "$OUT"
          ls -la "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: real_libstdc++.so-armeabi-v7a
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
